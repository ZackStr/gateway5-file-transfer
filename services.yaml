decorators:
  - name: gateway5-file-transfer
    schema:
      $id: gateway5-file-transfer
      $schema: https://json-schema.org/draft/202012/schema
      type: object
      required:
        - fs_host
        - fs_user
        - fs_password
        - device_host
        - device_user
        - device_password
        - src
        - dest
      properties:
        fs_host:
          type: string
          description: "File server hostname or IP"
        fs_user:
          type: string
          description: "File server SSH username"
        fs_password:
          type: string
          description: >-
            File server SSH password. Pass a resolved gateway-secret
            reference (e.g. $GATEWAYSECRET_(name)) here at call time
            rather than a literal value — chosen dynamically per call
            instead of being statically bound in this service's config.
            Note: this arrives as a CLI arg to the script, so the
            resolved plaintext is briefly visible in the gateway's
            process list during execution (deliberate trade-off for
            per-call flexibility; a static env-var-bound secret would
            avoid this but locks the service to one fixed secret name).
        device_host:
          type: string
          description: "Destination device hostname or IP"
        device_user:
          type: string
          description: "Destination device SSH/SCP username"
        device_password:
          type: string
          description: >-
            Destination device SSH/SCP password. Same dynamic
            gateway-secret-reference pattern and CLI-arg-exposure
            trade-off as fs_password above. Only ever touches the file
            server as a file (chmod 600, deleted immediately once read
            by the background transfer process) — never argv there.
        src:
          type: string
          description: "Absolute path to the source file on the file server"
        dest:
          type: string
          description: "Destination path on the device (e.g. flash:image.bin)"
      additionalProperties: false

  - name: gateway5-list-images
    schema:
      $id: gateway5-list-images
      $schema: https://json-schema.org/draft/202012/schema
      type: object
      required:
        - fs_host
        - fs_user
        - fs_password
        - directory
      properties:
        fs_host:
          type: string
          description: "File server hostname or IP"
        fs_user:
          type: string
          description: "File server SSH username"
        fs_password:
          type: string
          description: >-
            File server SSH password. Same dynamic gateway-secret-reference
            pattern as gateway5-file-transfer.
        directory:
          type: string
          description: >-
            Full path on the file server to list, e.g.
            /data/iosimages/9K. Per-model-family subfolder convention
            (mapping device model to folder name) is the calling
            workflow's responsibility, not this service's.
        extensions:
          type: string
          description: >-
            Comma-separated extensions to filter to, e.g.
            ".bin,.SPA.bin,.pkg". Omit to return every regular file in
            the directory.
      additionalProperties: false

  - name: gateway5-list-images-tree
    schema:
      $id: gateway5-list-images-tree
      $schema: https://json-schema.org/draft/202012/schema
      type: object
      required:
        - fs_host
        - fs_user
        - fs_password
        - base_path
      properties:
        fs_host:
          type: string
          description: "File server hostname or IP"
        fs_user:
          type: string
          description: "File server SSH username"
        fs_password:
          type: string
          description: >-
            File server SSH password. Same dynamic gateway-secret-reference
            pattern as gateway5-file-transfer.
        base_path:
          type: string
          description: >-
            Root directory to walk recursively, e.g.
            /home/smarts/IOS/Cisco/ (the binaryPath env var value) — every
            model-family subfolder underneath it is listed in one call.
        extensions:
          type: string
          description: >-
            Comma-separated extensions to filter to, e.g.
            ".bin,.SPA.bin,.pkg". Omit to return every regular file found.
      additionalProperties: false

  - name: gateway5-run-prompt-commands
    schema:
      $id: gateway5-run-prompt-commands
      $schema: https://json-schema.org/draft/202012/schema
      type: object
      required:
        - steps
      properties:
        steps:
          type: array
          minItems: 1
          description: >-
            Ordered steps, run over one SSH session. The device and its
            credentials come from the targeted Inventory Manager node,
            not from an input.
          items:
            type: object
            required:
              - command
            properties:
              command:
                type: string
                description: "CLI command to send"
              prompts:
                type: array
                description: >-
                  Prompts this command may raise. Matched in any order,
                  each answered at most once; anything not listed is
                  never answered.
                items:
                  type: object
                  required:
                    - expect
                    - respond
                  properties:
                    expect:
                      type: string
                      description: "Regex matched against the end of the output since the last answer"
                    respond:
                      type: string
                      description: 'Text to send. "" presses Enter with nothing typed.'
                    optional:
                      type: boolean
                      description: "True if the prompt may not appear"
                    sensitive:
                      type: boolean
                      description: "True to hide the response text in the result"
                  additionalProperties: false
              timeout:
                type: number
                description: "Seconds allowed for this step (default 120)"
              fail_on:
                type: array
                description: "Extra regexes that fail the step when found in its output"
                items:
                  type: string
              expect_output:
                description: >-
                  Optional outcome check: a regex, or a list of regexes that
                  must all match, which the step's output has to contain. If
                  it does not, the step fails and the run stops. Omit for no
                  check.
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
            additionalProperties: false
      additionalProperties: false

repositories:
  - name: gateway5-file-transfer-repo
    url: https://github.com/ZackStr/gateway5-file-transfer.git
    reference: main

services:
  - name: gateway5-file-transfer
    type: python-script
    description: >-
      Starts a file-server-to-device SCP push as a detached background
      process on the file server and returns immediately — does not wait
      for the transfer to complete. The calling workflow determines
      completion separately by polling `dir flash:<filename>` on the
      device until the file size stops growing.
    filename: main.py
    working-directory: "."
    repository: gateway5-file-transfer-repo
    decorator: gateway5-file-transfer
    tags:
      - network
      - file-transfer
    runtime:
      req-file: requirements.txt

  - name: gateway5-list-images
    type: python-script
    description: >-
      Lists files in a directory on the file server via SFTP (filename,
      size, mtime), optionally filtered by extension — used to populate
      the binary-selection dropdown after device selection.
    filename: list_images.py
    working-directory: "."
    repository: gateway5-file-transfer-repo
    decorator: gateway5-list-images
    tags:
      - network
      - file-transfer
    runtime:
      req-file: requirements.txt

  - name: gateway5-list-images-tree
    type: python-script
    description: >-
      Recursively lists every file under a base path on the file server
      in one SSH/SFTP session (one call for every model's binaries at
      once, instead of one call per model subfolder) — mirrors a common
      legacy ls-tree approach for cutting down on file-server round trips.
    filename: list_images_tree.py
    working-directory: "."
    repository: gateway5-file-transfer-repo
    decorator: gateway5-list-images-tree
    tags:
      - network
      - file-transfer
    runtime:
      req-file: requirements.txt

  - name: gateway5-run-prompt-commands
    type: python-script
    description: >-
      Runs CLI commands on a device and answers their interactive
      prompts (including a bare Enter). The device and credentials come
      from the targeted inventory node, so no secrets are passed in.
    filename: run_prompt_commands.py
    working-directory: "."
    repository: gateway5-file-transfer-repo
    decorator: gateway5-run-prompt-commands
    tags:
      - network
      - device-cli
    runtime:
      req-file: requirements.txt
